name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Building the frontend also runs TypeScript's strict type-check.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Restore and compile the API so backend code errors are caught before merging.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/CreditUnion.Api/CreditUnion.Api.csproj
      - run: dotnet build backend/CreditUnion.Api/CreditUnion.Api.csproj --no-restore --configuration Release
